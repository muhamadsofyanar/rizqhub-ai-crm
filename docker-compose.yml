services:
  web:
    build: .
    restart: unless-stopped
    environment: &app_environment
      DJANGO_DEBUG: ${DJANGO_DEBUG:-false}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-*}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-}
      DATABASE_URL: postgresql://${POSTGRES_USER:-rizqhub}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-rizqhub}
      REDIS_URL: redis://redis:6379/0
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8000}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      AI_PROVIDER: ${AI_PROVIDER:-auto}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.6-flash}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5-mini}
      AUTO_REPLY_DEFAULT: ${AUTO_REPLY_DEFAULT:-false}
      FEATURE_LIVE_INBOX: ${FEATURE_LIVE_INBOX:-true}
      FEATURE_MESSAGE_RETRY: ${FEATURE_MESSAGE_RETRY:-true}
      FEATURE_AI_EVALUATION: ${FEATURE_AI_EVALUATION:-true}
      FEATURE_AUTOMATION: ${FEATURE_AUTOMATION:-false}
      FEATURE_CAMPAIGN: ${FEATURE_CAMPAIGN:-false}
      FEATURE_SAAS: ${FEATURE_SAAS:-false}
      FEATURE_BACKUP: ${FEATURE_BACKUP:-true}
      LIVE_INBOX_POLL_SECONDS: ${LIVE_INBOX_POLL_SECONDS:-2.5}
      CAMPAIGN_MAX_RECIPIENTS: ${CAMPAIGN_MAX_RECIPIENTS:-500}
      WEBHOOK_RATE_LIMIT_PER_MINUTE: ${WEBHOOK_RATE_LIMIT_PER_MINUTE:-180}
      BACKUP_DIR: /app/backups
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      BACKUP_HOUR: ${BACKUP_HOUR:-2}
      SECURE_HSTS_SECONDS: ${SECURE_HSTS_SECONDS:-0}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - media_data:/app/media
      - backup_data:/app/backups
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health/"]
      interval: 30s
      timeout: 5s
      retries: 5

  worker:
    build: .
    restart: unless-stopped
    environment:
      <<: *app_environment
      SERVICE_MODE: worker
      CELERY_CONCURRENCY: ${CELERY_CONCURRENCY:-2}
      CELERY_LOG_LEVEL: ${CELERY_LOG_LEVEL:-INFO}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      web:
        condition: service_healthy
    volumes:
      - media_data:/app/media
      - backup_data:/app/backups

  beat:
    build: .
    restart: unless-stopped
    environment:
      <<: *app_environment
      SERVICE_MODE: beat
      CELERY_LOG_LEVEL: ${CELERY_LOG_LEVEL:-INFO}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      web:
        condition: service_healthy
    volumes:
      - backup_data:/app/backups

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rizqhub}
      POSTGRES_USER: ${POSTGRES_USER:-rizqhub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rizqhub} -d ${POSTGRES_DB:-rizqhub}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  redis_data:
  media_data:
  backup_data:
